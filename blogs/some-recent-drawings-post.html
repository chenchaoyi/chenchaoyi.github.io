<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Some Recent Drawings - Situ E. Chen</title>
    <link rel="icon" type="image/svg+xml" href="../images/site/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="../images/site/favicon.ico" />
    <link rel="apple-touch-icon" href="../images/site/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <style>
        .single-line-title {
            font-size: 2.2em;
        }
        /* A small exhibition — each drawing titled like a gallery plate. */
        .gallery {
            margin-top: 2.5em;
        }
        .artwork {
            margin: 0 0 3.2em;
        }
        .artwork-title {
            font-style: italic;
            font-weight: 400;
            font-size: 1.35em;
            color: var(--ink);
            margin: 0 0 0.7em;
        }
        .artwork img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.09);
        }
        .artwork.portrait img {
            width: 58%;
            margin: 0 auto;
        }
        .ps-note {
            font-style: italic;
            color: var(--ink-soft);
            margin: 0 0 0.9em;
        }
        @media (max-width: 640px) {
            .artwork { margin-bottom: 2.4em; }
            .artwork.portrait img { width: 86%; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="../index.html" class="brand">
                <span class="brand-name">
                    <span class="brand-en">Situ E. Chen</span>
                    <span class="mono">situchen.me</span>
                </span>
            </a>
            <nav>
                <ul class="nav">
                    <li><a href="../index.html#top">Top</a></li>
                    <li><a href="../index.html#work">Work</a></li>
                    <li><a href="../index.html#portfolio">Portfolio</a></li>
                    <li><a href="../blog.html" class="active">Blog</a></li>
                    <li><a href="../index.html#contact">Contact</a></li>
                </ul>
                <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span class="bars"></span></button>
            </nav>
        </div>
    </header>

    <main>
        <article class="wrapper style2">
            <div class="container">
                <div class="row">
                    <div class="col-8 col-12-medium" style="margin: 0 auto; max-width: 800px;">
                        <article class="box style1" style="padding: 3em;">
                            <h2 class="single-line-title">Some Recent Drawings</h2>
                            <p class="post-meta">Posted on February 23, 2026</p>

                            <div class="gallery">
                                <figure class="artwork">
                                    <figcaption class="artwork-title">Drowning</figcaption>
                                    <img src="../images/blog/drawings/drowning.jpg" alt="Drowning — a small figure suspended between dark tangled currents above and bright jagged peaks below" />
                                </figure>

                                <figure class="artwork">
                                    <figcaption class="artwork-title">Inevitability</figcaption>
                                    <img src="../images/blog/drawings/inevitability.jpg" alt="Inevitability — a girl with tear-streaked cheeks beside a long road drawn in perspective lines" />
                                </figure>

                                <figure class="artwork">
                                    <figcaption class="artwork-title">Metamorphosis</figcaption>
                                    <img src="../images/blog/drawings/metamorphosis.jpg" alt="Metamorphosis — a boy sitting in speckled rain, shielding his eyes from a radiating sun" />
                                </figure>

                                <figure class="artwork">
                                    <figcaption class="artwork-title">Redemption</figcaption>
                                    <img src="../images/blog/drawings/redemption.jpg" alt="Redemption — a girl with crossed arms, her braid streaming into wind-swept lines" />
                                </figure>

                                <figure class="artwork">
                                    <figcaption class="artwork-title">Haunted</figcaption>
                                    <img src="../images/blog/drawings/haunted.jpg" alt="Haunted — a girl wading through swirling waves toward a distant figure on the horizon" />
                                </figure>

                                <figure class="artwork">
                                    <figcaption class="artwork-title">Generation</figcaption>
                                    <img src="../images/blog/drawings/generation.jpg" alt="Generation — a tearful face before a harvested field and a single bare tree" />
                                </figure>

                                <figure class="artwork">
                                    <figcaption class="artwork-title">Tedo</figcaption>
                                    <img src="../images/blog/drawings/tedo.jpg" alt="Tedo — a page of pencil sketches of a small dog playing, sleeping and making faces" />
                                </figure>

                                <figure class="artwork portrait">
                                    <figcaption class="ps-note">P.S. Tedo is my 3-year-old poodle :）</figcaption>
                                    <img src="../images/blog/drawings/tedo-real.jpg" alt="A photo of Tedo, a grey toy poodle, resting his paws on the sofa" />
                                </figure>
                            </div>

                            <a href="../blog.html" class="button small" style="margin-top: 2em;">← Back to Blog</a>
                        </article>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <footer class="site-foot">
        <div class="wrap foot-inner">
            <div class="sig">&copy; Situ E. Chen. All rights reserved.</div>
            <div>Last updated · Jun 6&nbsp;2026</div>
        </div>
    </footer>
    <script>
        (function(){
            const t = document.getElementById('nav-toggle');
            const n = document.querySelector('.nav');
            if (!t || !n) return;
            t.addEventListener('click', () => {
                const open = n.classList.toggle('open');
                t.classList.toggle('open', open);
                t.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            n.addEventListener('click', e => {
                if (e.target.tagName === 'A') {
                    n.classList.remove('open');
                    t.classList.remove('open');
                    t.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>

</body>
</html>
